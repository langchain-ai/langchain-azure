name: hosted-sample-tracing

on:
  pull_request:
    paths:
      - "samples/**"
      - "libs/azure-ai/langchain_azure_ai/**"
      - "libs/azure-ai/pyproject.toml"
      - ".github/workflows/hosted-sample-tracing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    name: "hosted tracing #${{ matrix.python-version }}"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tracing test dependencies
        run: |
          uv venv
          uv pip install -r samples/hosting/tests/requirements.txt
      - name: Check all hosted samples
        run: .venv/bin/python -m pytest samples/hosting/tests/test_tracing.py -q --basetemp="${{ runner.temp }}/hosted-tracing"
