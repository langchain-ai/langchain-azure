version: 2
updates:
  - package-ecosystem: "uv"
    directories:
      - "/libs/*"
      - "/.github/tests"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "langchain-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "langchain"
        update-types: ["version-update:semver-major"]
      - dependency-name: "langchain-classic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "langchain-text-splitters"
        update-types: ["version-update:semver-major"]
      - dependency-name: "langchain-tests"
        update-types: ["version-update:semver-major"]
      - dependency-name: "langchain-model-profiles"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directories:
      - "/samples/**"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "samples"
    commit-message:
      prefix: "chore(samples)"
    groups:
      samples:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/.devcontainer"
      - "/samples/**"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
