# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: langchain-azure-responses-resilience-e2e
services:
    ai-project:
        host: azure.ai.project
    langchain-azure-responses-resilience-e2e:
        project: server
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Deterministic ResponsesHostServer checkpoint recovery E2E agent.
        kind: hosted
        name: langchain-azure-responses-resilience-e2e
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
hooks:
    prepackage:
        windows:
            shell: pwsh
            run: python .\server\prepare_package.py
            interactive: false
            continueOnError: false
        posix:
            shell: sh
            run: python3 ./server/prepare_package.py
            interactive: false
            continueOnError: false