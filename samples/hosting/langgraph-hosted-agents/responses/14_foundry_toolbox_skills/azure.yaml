name: langchain-azure-toolbox-skills-responses

infra:
  provider: microsoft.foundry

services:
  langchain-azure-toolbox-skills-responses:
    project: .
    host: azure.ai.agent
    language: docker
    kind: hosted
    name: langchain-azure-toolbox-skills-responses
    description: A LangChain agent that loads skills on demand from a Foundry Toolbox.
    docker:
      remoteBuild: true
    container:
      resources:
        cpu: "0.25"
        memory: 0.5Gi
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_NAME: ${TOOLBOX_NAME}
    protocols:
      - protocol: responses
        version: 2.0.0
